<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="gfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A022B"/>
      <stop offset="50%" stop-color="#31065E"/>
      <stop offset="100%" stop-color="#3D087B"/>
    </linearGradient>
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#C026D3" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#52119B" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="purpleBead" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="50%" stop-color="#C026D3"/>
      <stop offset="100%" stop-color="#52119B"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#gfBg)"/>

  <!-- Modern Facade Glass Panels Grid -->
  <g transform="translate(60, 40)">
    <!-- Panel 1 -->
    <rect x="0" y="0" width="150" height="150" fill="url(#glassShine)" rx="4"/>
    <polygon points="0,0 80,0 0,80" fill="#FFF" opacity="0.25"/>

    <!-- Panel 2 -->
    <rect x="165" y="0" width="150" height="150" fill="url(#glassShine)" rx="4"/>
    <polygon points="165,0 245,0 165,80" fill="#FFF" opacity="0.25"/>

    <!-- Panel 3 -->
    <rect x="330" y="0" width="150" height="150" fill="url(#glassShine)" rx="4"/>
    <polygon points="330,0 410,0 330,80" fill="#FFF" opacity="0.25"/>

    <!-- Panel 4 -->
    <rect x="0" y="165" width="150" height="150" fill="url(#glassShine)" rx="4"/>
    <polygon points="0,165 80,165 0,245" fill="#FFF" opacity="0.25"/>

    <!-- Panel 5 -->
    <rect x="165" y="165" width="150" height="150" fill="url(#glassShine)" rx="4"/>
    <polygon points="165,165 245,165 165,245" fill="#FFF" opacity="0.25"/>

    <!-- Panel 6 -->
    <rect x="330" y="165" width="150" height="150" fill="url(#glassShine)" rx="4"/>
    <polygon points="330,165 410,165 330,245" fill="#FFF" opacity="0.25"/>

    <!-- Silicone Joint Sealing Lines Between All Glass Panes -->
    <!-- Vertical joints -->
    <rect x="150" y="-10" width="15" height="340" fill="#171321"/>
    <rect x="155" y="-10" width="5" height="340" fill="url(#purpleBead)"/>

    <rect x="315" y="-10" width="15" height="340" fill="#171321"/>
    <rect x="320" y="-10" width="5" height="340" fill="url(#purpleBead)"/>

    <!-- Horizontal joints -->
    <rect x="-10" y="150" width="500" height="15" fill="#171321"/>
    <rect x="-10" y="155" width="500" height="5" fill="url(#purpleBead)"/>

    <!-- Spider Fitting Connection at intersection -->
    <circle cx="157.5" cy="157.5" r="16" fill="#4B5563" stroke="#9CA3AF" stroke-width="2"/>
    <circle cx="157.5" cy="157.5" r="7" fill="#C026D3"/>
    
    <circle cx="322.5" cy="157.5" r="16" fill="#4B5563" stroke="#9CA3AF" stroke-width="2"/>
    <circle cx="322.5" cy="157.5" r="7" fill="#C026D3"/>
  </g>

  <!-- Overlay Badge -->
  <g transform="translate(370, 275)">
    <rect width="180" height="50" rx="8" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="25" cy="25" r="14" fill="#F2E8FC"/>
    <path d="M19 25L23 29L31 20" stroke="#C026D3" stroke-width="2.5" stroke-linecap="round"/>
    <text x="48" y="21" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="11" fill="#31065E">Structural Glazing</text>
    <text x="48" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="9" fill="#52119B">Welfix Heritage</text>
  </g>
</svg>
