<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="intBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31065E"/>
      <stop offset="60%" stop-color="#3D087B"/>
      <stop offset="100%" stop-color="#52119B"/>
    </linearGradient>
    <linearGradient id="wallPaint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2E8FC"/>
      <stop offset="100%" stop-color="#E9D5FF"/>
    </linearGradient>
    <linearGradient id="floorWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="50%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#intBg)"/>

  <!-- Interior Wall & Floor Perspective -->
  <g transform="translate(50, 40)">
    <!-- Wall Surface -->
    <rect x="0" y="0" width="500" height="230" rx="4" fill="url(#wallPaint)"/>

    <!-- Decorative Interior Wall Paneling Moulding -->
    <rect x="30" y="30" width="120" height="170" rx="3" fill="#FFFFFF" stroke="#C026D3" stroke-width="1.5" stroke-dasharray="4 2"/>
    <rect x="180" y="30" width="140" height="170" rx="3" fill="#FFFFFF" stroke="#C026D3" stroke-width="1.5" stroke-dasharray="4 2"/>
    <rect x="350" y="30" width="120" height="170" rx="3" fill="#FFFFFF" stroke="#C026D3" stroke-width="1.5" stroke-dasharray="4 2"/>

    <!-- Baseboard Molding Along Wall Base -->
    <rect x="0" y="210" width="500" height="20" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    
    <!-- WELFIX Flexible Joint Seal Line between Baseboard & Floor -->
    <rect x="0" y="228" width="500" height="5" fill="#C026D3"/>

    <!-- Floor Surface -->
    <rect x="0" y="233" width="500" height="90" fill="url(#floorWood)"/>
    <!-- Floor Planks -->
    <line x1="120" y1="233" x2="80" y2="323" stroke="#4B5563" stroke-width="1.5"/>
    <line x1="260" y1="233" x2="220" y2="323" stroke="#4B5563" stroke-width="1.5"/>
    <line x1="400" y1="233" x2="360" y2="323" stroke="#4B5563" stroke-width="1.5"/>

    <!-- Interior Plant / Living Room Accent -->
    <ellipse cx="90" cy="225" rx="20" ry="8" fill="#111827" opacity="0.3"/>
    <path d="M80 230 L84 190 L96 190 L100 230 Z" fill="#52119B"/>
    <path d="M90 190 C70 150, 60 140, 50 160 C65 175, 80 185, 90 190 Z" fill="#C026D3" opacity="0.8"/>
    <path d="M90 190 C110 150, 120 140, 130 160 C115 175, 100 185, 90 190 Z" fill="#9333EA" opacity="0.8"/>
  </g>

  <!-- Overlay Badge -->
  <g transform="translate(370, 280)">
    <rect width="180" height="50" rx="8" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="25" cy="25" r="14" fill="#F2E8FC"/>
    <path d="M19 25L23 29L31 20" stroke="#C026D3" stroke-width="2.5" stroke-linecap="round"/>
    <text x="48" y="21" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="11" fill="#31065E">Seamless Finishes</text>
    <text x="48" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="9" fill="#52119B">Paintable &amp; Flexible Gap Filling</text>
  </g>
</svg>
