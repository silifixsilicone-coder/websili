<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="gsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31065E"/>
      <stop offset="60%" stop-color="#3D087B"/>
      <stop offset="100%" stop-color="#52119B"/>
    </linearGradient>
    <linearGradient id="brickColor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A1D2F"/>
      <stop offset="100%" stop-color="#5C243B"/>
    </linearGradient>
    <linearGradient id="metalBead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C026D3"/>
      <stop offset="100%" stop-color="#F2E8FC"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#gsBg)"/>

  <!-- Multi-surface cross-section: Concrete, Metal Flashing, Glass, Masonry -->
  <g transform="translate(60, 45)">
    <!-- Substrate 1: Concrete block -->
    <rect x="0" y="0" width="220" height="150" rx="4" fill="#374151" stroke="#4B5563" stroke-width="2"/>
    <text x="20" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="10" fill="#9CA3AF">MASONRY / CONCRETE</text>
    
    <!-- Substrate 2: Aluminum channel / flashing -->
    <rect x="250" y="0" width="220" height="150" rx="4" fill="#1F2937" stroke="#4B5563" stroke-width="2"/>
    <text x="270" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="10" fill="#9CA3AF">METAL &amp; ALUMINUM</text>

    <!-- Substrate 3: Glass sheet -->
    <rect x="0" y="175" width="220" height="145" rx="4" fill="#1E1435" stroke="#7E22CE" stroke-width="2"/>
    <text x="20" y="205" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="10" fill="#D8B4FE">ARCHITECTURAL GLASS</text>

    <!-- Substrate 4: Wood / Composite -->
    <rect x="250" y="175" width="220" height="145" rx="4" fill="#2E1065" stroke="#7E22CE" stroke-width="2"/>
    <text x="270" y="205" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="10" fill="#D8B4FE">UPVC &amp; TIMBER</text>

    <!-- Center Joint Hub with Strong Elastic Bond -->
    <circle cx="235" cy="162" r="35" fill="#31065E" stroke="#C026D3" stroke-width="3"/>
    
    <!-- WELFIX Sealant Beads Binding all 4 Materials -->
    <line x1="220" y1="0" x2="220" y2="320" stroke="url(#metalBead)" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="162" x2="470" y2="162" stroke="url(#metalBead)" stroke-width="6" stroke-linecap="round"/>

    <!-- Seal Icon in center -->
    <circle cx="235" cy="162" r="14" fill="#C026D3"/>
    <path d="M229 162 L233 166 L241 157" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Overlay Badge -->
  <g transform="translate(370, 280)">
    <rect width="180" height="50" rx="8" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="25" cy="25" r="14" fill="#F2E8FC"/>
    <path d="M19 25L23 29L31 20" stroke="#C026D3" stroke-width="2.5" stroke-linecap="round"/>
    <text x="48" y="21" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="11" fill="#31065E">Multi-Surface</text>
    <text x="48" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="9" fill="#52119B">Universal Adhesion</text>
  </g>
</svg>
