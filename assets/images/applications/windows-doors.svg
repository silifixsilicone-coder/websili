<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="wdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31065E"/>
      <stop offset="60%" stop-color="#3D087B"/>
      <stop offset="100%" stop-color="#52119B"/>
    </linearGradient>
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#F2E8FC" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sealBead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C026D3"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="400" fill="url(#wdBg)"/>
  
  <!-- Architectural Wall Framing Grid -->
  <g opacity="0.15">
    <line x1="50" y1="0" x2="50" y2="400" stroke="#FFF" stroke-width="1"/>
    <line x1="150" y1="0" x2="150" y2="400" stroke="#FFF" stroke-width="1"/>
    <line x1="250" y1="0" x2="250" y2="400" stroke="#FFF" stroke-width="1"/>
    <line x1="350" y1="0" x2="350" y2="400" stroke="#FFF" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="400" stroke="#FFF" stroke-width="1"/>
    <line x1="550" y1="0" x2="550" y2="400" stroke="#FFF" stroke-width="1"/>
    <line x1="0" y1="100" x2="600" y2="100" stroke="#FFF" stroke-width="1"/>
    <line x1="0" y1="200" x2="600" y2="200" stroke="#FFF" stroke-width="1"/>
    <line x1="0" y1="300" x2="600" y2="300" stroke="#FFF" stroke-width="1"/>
  </g>

  <!-- Window & Sliding Door Frame -->
  <rect x="80" y="50" width="440" height="290" rx="12" fill="#171321" stroke="#4B5563" stroke-width="6"/>
  <rect x="96" y="66" width="200" height="258" rx="6" fill="#1E1435" stroke="#374151" stroke-width="4"/>
  <rect x="304" y="66" width="200" height="258" rx="6" fill="#1E1435" stroke="#374151" stroke-width="4"/>

  <!-- Glass Panes with Glazing Reflections -->
  <rect x="106" y="76" width="180" height="238" fill="url(#glassReflection)"/>
  <polygon points="106,76 220,76 106,190" fill="#FFFFFF" opacity="0.12"/>
  <polygon points="106,140 286,76 286,130 106,194" fill="#FFFFFF" opacity="0.08"/>

  <rect x="314" y="76" width="180" height="238" fill="url(#glassReflection)"/>
  <polygon points="314,76 430,76 314,190" fill="#FFFFFF" opacity="0.12"/>

  <!-- Precision Sealant Beads around perimeter (WELFIX Joint) -->
  <rect x="80" y="50" width="440" height="290" rx="12" fill="none" stroke="url(#sealBead)" stroke-width="4.5" stroke-dasharray="12 4" stroke-opacity="0.9"/>
  <!-- Highlight beads on joints -->
  <line x1="300" y1="50" x2="300" y2="340" stroke="url(#sealBead)" stroke-width="4"/>

  <!-- Door Handle -->
  <rect x="274" y="170" width="10" height="50" rx="4" fill="#E5E7EB"/>
  <circle cx="279" cy="195" r="3" fill="#171321"/>

  <!-- Feature Callout Badge -->
  <g transform="translate(370, 270)">
    <rect width="180" height="50" rx="8" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="25" cy="25" r="14" fill="#F2E8FC"/>
    <path d="M19 25L23 29L31 20" stroke="#C026D3" stroke-width="2.5" stroke-linecap="round"/>
    <text x="48" y="21" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="11" fill="#31065E">Perimeter Sealing</text>
    <text x="48" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="9" fill="#52119B">Draft &amp; Water Proof</text>
  </g>
</svg>
