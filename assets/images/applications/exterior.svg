<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="extSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A022B"/>
      <stop offset="60%" stop-color="#31065E"/>
      <stop offset="100%" stop-color="#3D087B"/>
    </linearGradient>
    <linearGradient id="panelClad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="40%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="sunRay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C026D3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#52119B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#extSky)"/>

  <!-- Sun Rays & Weather Environment -->
  <polygon points="0,0 200,0 0,350" fill="url(#sunRay)"/>
  <circle cx="60" cy="50" r="30" fill="#E879F9" opacity="0.15" filter="blur(8px)"/>

  <!-- High-Rise Exterior Facade Panels -->
  <g transform="translate(60, 40)">
    <!-- Cladding Panel Grid -->
    <rect x="0" y="0" width="230" height="150" rx="4" fill="url(#panelClad)" stroke="#6B7280" stroke-width="1.5"/>
    <rect x="250" y="0" width="230" height="150" rx="4" fill="url(#panelClad)" stroke="#6B7280" stroke-width="1.5"/>
    <rect x="0" y="170" width="230" height="150" rx="4" fill="url(#panelClad)" stroke="#6B7280" stroke-width="1.5"/>
    <rect x="250" y="170" width="230" height="150" rx="4" fill="url(#panelClad)" stroke="#6B7280" stroke-width="1.5"/>

    <!-- Expansion Joint Channels with Backer Rod & WELFIX Weatherproof Sealant -->
    <!-- Vertical Expansion Joint -->
    <rect x="230" y="-10" width="20" height="340" fill="#111827"/>
    <line x1="240" y1="-10" x2="240" y2="330" stroke="#C026D3" stroke-width="7" stroke-linecap="round"/>
    <line x1="240" y1="-10" x2="240" y2="330" stroke="#E879F9" stroke-width="2" stroke-linecap="round"/>

    <!-- Horizontal Expansion Joint -->
    <rect x="-10" y="150" width="500" height="20" fill="#111827"/>
    <line x1="-10" y1="160" x2="490" y2="160" stroke="#C026D3" stroke-width="7" stroke-linecap="round"/>
    <line x1="-10" y1="160" x2="490" y2="160" stroke="#E879F9" stroke-width="2" stroke-linecap="round"/>

    <!-- Rain / Weather resistance indicators (raindrops deflecting) -->
    <g stroke="#F2E8FC" stroke-width="2" stroke-linecap="round" opacity="0.6">
      <line x1="120" y1="40" x2="110" y2="60"/>
      <line x1="180" y1="80" x2="170" y2="100"/>
      <line x1="320" y1="30" x2="310" y2="50"/>
      <line x1="400" y1="90" x2="390" y2="110"/>
      <line x1="360" y1="200" x2="350" y2="220"/>
    </g>
  </g>

  <!-- Overlay Badge -->
  <g transform="translate(370, 280)">
    <rect width="180" height="50" rx="8" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="25" cy="25" r="14" fill="#F2E8FC"/>
    <path d="M19 25L23 29L31 20" stroke="#C026D3" stroke-width="2.5" stroke-linecap="round"/>
    <text x="48" y="21" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="11" fill="#31065E">UV &amp; Rain Defense</text>
    <text x="48" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="9" fill="#52119B">High Thermal Expansion</text>
  </g>
</svg>
