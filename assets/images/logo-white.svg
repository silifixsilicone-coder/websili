<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <linearGradient id="wfGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F2E8FC"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C026D3"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
    <filter id="whiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#C026D3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Iconic W Bond Seal Symbol -->
  <g filter="url(#whiteGlow)" transform="translate(10, 12)">
    <path d="M12 18L32 68L48 26L64 68L84 18H68L56 50L48 30L40 50L28 18H12Z" fill="url(#wfGradLight)"/>
    <circle cx="48" cy="20" r="7" fill="url(#magentaGrad)"/>
    <circle cx="20" cy="72" r="5" fill="#FFFFFF"/>
    <circle cx="76" cy="72" r="5" fill="#C026D3"/>
    <path d="M22 69 C 32 80, 64 80, 74 69" stroke="url(#magentaGrad)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Typography -->
  <text x="115" y="58" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="-0.5">WEL<tspan fill="#C026D3">FIX</tspan></text>
  
  <text x="117" y="78" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="12" fill="#F2E8FC" letter-spacing="4">SOLUTIONS</text>
  <rect x="235" y="72" width="70" height="2" fill="url(#magentaGrad)" rx="1"/>
</svg>
