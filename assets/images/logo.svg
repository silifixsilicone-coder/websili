<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <linearGradient id="wfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31065E"/>
      <stop offset="45%" stop-color="#52119B"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C026D3"/>
      <stop offset="100%" stop-color="#F2E8FC"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#52119B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Iconic W Bond Seal Symbol -->
  <g filter="url(#softGlow)" transform="translate(10, 12)">
    <!-- Base geometric bond shields -->
    <path d="M12 18L32 68L48 26L64 68L84 18H68L56 50L48 30L40 50L28 18H12Z" fill="url(#wfGrad)"/>
    <!-- Overlapping precision sealant bead node -->
    <circle cx="48" cy="20" r="7" fill="url(#accentGrad)"/>
    <circle cx="20" cy="72" r="5" fill="#52119B"/>
    <circle cx="76" cy="72" r="5" fill="#C026D3"/>
    <!-- Connecting flex arches -->
    <path d="M22 69 C 32 80, 64 80, 74 69" stroke="url(#wfGrad)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Typography -->
  <text x="115" y="58" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="44" fill="#31065E" letter-spacing="-0.5">WEL<tspan fill="#C026D3">FIX</tspan></text>
  
  <text x="117" y="78" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="12" fill="#52119B" letter-spacing="4">SOLUTIONS</text>
  <rect x="235" y="72" width="70" height="2" fill="url(#accentGrad)" rx="1"/>
</svg>
