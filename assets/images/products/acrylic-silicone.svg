<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" fill="none">
  <defs>
    <!-- Background ambiance -->
    <radialGradient id="cartridgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2E8FC" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#F8F4FC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Cylindrical lighting gradients -->
    <linearGradient id="bodyCylinder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#31065E"/>
      <stop offset="15%" stop-color="#52119B"/>
      <stop offset="42%" stop-color="#7B1FA2"/>
      <stop offset="55%" stop-color="#A855F7"/>
      <stop offset="70%" stop-color="#52119B"/>
      <stop offset="90%" stop-color="#3D087B"/>
      <stop offset="100%" stop-color="#230345"/>
    </linearGradient>

    <linearGradient id="labelBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8F4FC"/>
      <stop offset="25%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDE0FA"/>
    </linearGradient>

    <linearGradient id="magentaBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9D174D"/>
      <stop offset="30%" stop-color="#C026D3"/>
      <stop offset="70%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#A21CAF"/>
    </linearGradient>

    <linearGradient id="nozzleShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D1D5DB"/>
      <stop offset="25%" stop-color="#F3F4F6"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>

    <linearGradient id="threadedCollar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9CA3AF"/>
      <stop offset="40%" stop-color="#E5E7EB"/>
      <stop offset="75%" stop-color="#F3F4F6"/>
      <stop offset="100%" stop-color="#6B7280"/>
    </linearGradient>

    <filter id="cartridgeShadow" x="-30%" y="-10%" width="160%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#31065E" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Aura -->
  <ellipse cx="250" cy="380" rx="200" ry="240" fill="url(#cartridgeGlow)"/>

  <!-- Cartridge Shadow on Table -->
  <ellipse cx="250" cy="650" rx="110" ry="18" fill="#31065E" opacity="0.2" filter="blur(8px)"/>

  <!-- Main Cartridge Group -->
  <g filter="url(#cartridgeShadow)">
    
    <!-- Plunger Base Ring at bottom -->
    <path d="M180 580 C180 570, 320 570, 320 580 C320 590, 180 590, 180 580 Z" fill="#4B5563"/>
    <rect x="180" y="580" width="140" height="15" rx="3" fill="url(#threadedCollar)"/>
    <ellipse cx="250" cy="595" rx="70" ry="8" fill="#374151"/>

    <!-- Main Cylindrical Tube Body -->
    <rect x="180" y="200" width="140" height="380" rx="4" fill="url(#bodyCylinder)"/>

    <!-- Glossy Tube Highlight -->
    <rect x="238" y="200" width="22" height="380" fill="#FFFFFF" opacity="0.22"/>
    <rect x="245" y="200" width="6" height="380" fill="#FFFFFF" opacity="0.45"/>

    <!-- Printed Packaging Label Section -->
    <g transform="translate(182, 230)">
      <!-- Label Background Base -->
      <rect x="0" y="0" width="136" height="330" rx="2" fill="url(#labelBg)"/>
      <rect x="56" y="0" width="22" height="330" fill="#FFFFFF" opacity="0.35"/>

      <!-- Top Purple Accent Bar -->
      <rect x="0" y="0" width="136" height="18" fill="#31065E"/>
      <text x="68" y="13" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="7.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">PROFESSIONAL GRADE</text>

      <!-- Brand Logo Header -->
      <text x="68" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="22" fill="#31065E" text-anchor="middle" letter-spacing="-0.5">WEL<tspan fill="#C026D3">FIX</tspan></text>
      <text x="68" y="55" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="6.5" fill="#52119B" text-anchor="middle" letter-spacing="2.5">SEALING SOLUTIONS</text>
      <line x1="20" y1="60" x2="116" y2="60" stroke="#C026D3" stroke-width="1.5"/>

      <!-- Magenta Product Category Ribbon -->
      <rect x="0" y="68" width="136" height="28" fill="url(#magentaBanner)"/>
      <text x="68" y="80" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="9" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">ACRYLIC</text>
      <text x="68" y="91" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="7" fill="#F8F4FC" text-anchor="middle" letter-spacing="0.2">SILICONE SEALANT</text>

      <!-- Subtitle -->
      <rect x="12" y="103" width="112" height="15" rx="3" fill="#F2E8FC"/>
      <text x="68" y="113.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="6" fill="#52119B" text-anchor="middle" letter-spacing="0.4">GENERAL PURPOSE</text>

      <!-- Verified Packaging Features Icons / Bullet list -->
      <g transform="translate(14, 126)">
        <!-- Feature 1 -->
        <circle cx="6" cy="7" r="3.5" fill="#52119B"/>
        <polyline points="4.5,7 6,8.5 8,5.5" stroke="#FFF" stroke-width="1" fill="none"/>
        <text x="14" y="9.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="6.5" fill="#171321">Flexible &amp; Durable</text>

        <!-- Feature 2 -->
        <circle cx="6" cy="22" r="3.5" fill="#52119B"/>
        <polyline points="4.5,22 6,23.5 8,20.5" stroke="#FFF" stroke-width="1" fill="none"/>
        <text x="14" y="24.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="6.5" fill="#171321">Waterproof</text>

        <!-- Feature 3 -->
        <circle cx="6" cy="37" r="3.5" fill="#52119B"/>
        <polyline points="4.5,37 6,38.5 8,35.5" stroke="#FFF" stroke-width="1" fill="none"/>
        <text x="14" y="39.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="6.5" fill="#171321">Weather Resistant</text>

        <!-- Feature 4 -->
        <circle cx="6" cy="52" r="3.5" fill="#C026D3"/>
        <polyline points="4.5,52 6,53.5 8,50.5" stroke="#FFF" stroke-width="1" fill="none"/>
        <text x="14" y="54.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="6.5" fill="#C026D3">High Flexibility</text>
      </g>

      <!-- Applications line -->
      <line x1="14" y1="192" x2="122" y2="192" stroke="#E5E7EB" stroke-width="1"/>
      <text x="68" y="202" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="6" fill="#3D087B" text-anchor="middle" letter-spacing="0.5">WINDOWS • GLASS • INTERIOR • EXTERIOR</text>

      <!-- Pack size badge -->
      <rect x="25" y="215" width="86" height="28" rx="6" fill="#31065E"/>
      <text x="68" y="228" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="6" fill="#E879F9" text-anchor="middle" letter-spacing="1">NET CONTENTS</text>
      <text x="68" y="239" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">300 ml</text>

      <!-- Manufacturer & Marketer micro-print -->
      <text x="68" y="260" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="5" fill="#6B7280" text-anchor="middle">MFG: Welfix</text>
      <text x="68" y="268" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="5" fill="#6B7280" text-anchor="middle">MKT: WELFIX SOLUTIONS</text>
      <text x="68" y="276" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="4.5" fill="#9CA3AF" text-anchor="middle">PUNE, MAHARASHTRA, INDIA</text>

      <!-- Barcode simulation -->
      <g transform="translate(32, 288)">
        <rect x="0" y="0" width="2" height="18" fill="#171321"/>
        <rect x="4" y="0" width="1.5" height="18" fill="#171321"/>
        <rect x="8" y="0" width="3" height="18" fill="#171321"/>
        <rect x="13" y="0" width="1" height="18" fill="#171321"/>
        <rect x="16" y="0" width="2.5" height="18" fill="#171321"/>
        <rect x="21" y="0" width="1.5" height="18" fill="#171321"/>
        <rect x="25" y="0" width="4" height="18" fill="#171321"/>
        <rect x="31" y="0" width="2" height="18" fill="#171321"/>
        <rect x="35" y="0" width="1" height="18" fill="#171321"/>
        <rect x="38" y="0" width="3" height="18" fill="#171321"/>
        <rect x="43" y="0" width="2" height="18" fill="#171321"/>
        <rect x="47" y="0" width="1" height="18" fill="#171321"/>
        <rect x="50" y="0" width="3" height="18" fill="#171321"/>
        <rect x="55" y="0" width="1.5" height="18" fill="#171321"/>
        <rect x="58" y="0" width="3" height="18" fill="#171321"/>
        <rect x="63" y="0" width="2" height="18" fill="#171321"/>
        <rect x="67" y="0" width="4" height="18" fill="#171321"/>
      </g>
      <text x="68" y="316" font-family="monospace" font-size="5" fill="#4B5563" text-anchor="middle">8 901234 567890</text>
    </g>

    <!-- Cartridge Shoulder -->
    <path d="M180 200 C180 180, 210 170, 235 168 L265 168 C290 170, 320 180, 320 200 Z" fill="url(#bodyCylinder)"/>
    <ellipse cx="250" cy="170" rx="30" ry="5" fill="url(#threadedCollar)"/>

    <!-- Threaded Collar Neck -->
    <rect x="238" y="148" width="24" height="22" rx="2" fill="url(#threadedCollar)"/>
    <line x1="238" y1="154" x2="262" y2="154" stroke="#4B5563" stroke-width="1.5"/>
    <line x1="238" y1="160" x2="262" y2="160" stroke="#4B5563" stroke-width="1.5"/>

    <!-- Conical Extrusion Nozzle -->
    <path d="M239 150 L246 50 L254 50 L261 150 Z" fill="url(#nozzleShade)"/>
    <!-- Angled cut tip of nozzle -->
    <ellipse cx="250" cy="50" rx="4" ry="1.5" fill="#9CA3AF"/>
    <!-- Nozzle highlight -->
    <path d="M248 150 L249 50 L251 50 L252 150 Z" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- Verified Authentic Product Badge floating on side -->
  <g transform="translate(330, 210)">
    <rect x="0" y="0" width="135" height="48" rx="8" fill="#FFFFFF" filter="url(#cartridgeShadow)"/>
    <circle cx="24" cy="24" r="14" fill="#F2E8FC"/>
    <path d="M18 24L22 28L30 19" stroke="#C026D3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="8" fill="#31065E">VERIFIED SPECS</text>
    <text x="44" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="7.5" fill="#6B7280">Packaging Match</text>
  </g>

  <!-- Pack size pill badge -->
  <g transform="translate(45, 330)">
    <rect x="0" y="0" width="115" height="54" rx="8" fill="#31065E" filter="url(#cartridgeShadow)"/>
    <rect x="2" y="2" width="111" height="50" rx="6" fill="#3D087B"/>
    <text x="57" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="7.5" fill="#E879F9" text-anchor="middle" letter-spacing="1">CARTRIDGE SIZE</text>
    <text x="57" y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">300 ml</text>
  </g>
</svg>
